<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HighPeaks Lietuva — Race Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #10202A;
    --bg-panel: #16303C;
    --bg-panel-2: #1C3A47;
    --line: #2A4B58;
    --text: #EAF1F0;
    --text-dim: #8FADB3;
    --accent: #3FA9A0;
    --accent-warm: #E8A33D;
    --swim: #3E8FB0;
    --bike: #E0954E;
    --run: #6FA96A;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:32px 20px 80px;}

  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:20px;margin-bottom:28px;flex-wrap:wrap;gap:12px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);margin:0 0 6px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:clamp(24px,4vw,34px);
    margin:0;letter-spacing:-0.01em;
  }
  .sub{color:var(--text-dim);font-size:14px;margin-top:6px;}

  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;margin-bottom:28px;
  }
  .stat{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat .n{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;color:var(--accent-warm);}
  .stat .l{font-size:12px;color:var(--text-dim);margin-top:4px;}

  .controls{
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;
  }
  select, input[type="text"]{
    background:var(--bg-panel);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;font-family:'Inter',sans-serif;font-size:13px;
    min-width:160px;
  }
  input[type="text"]{min-width:220px;}
  select:focus, input:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .empty{
    text-align:center;padding:60px 20px;color:var(--text-dim);
    border:1px dashed var(--line);border-radius:var(--radius);
  }
  .empty strong{color:var(--text);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-family:'JetBrains Mono',monospace;font-weight:400;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);
    padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;
    white-space:nowrap;
  }
  thead th:hover{color:var(--text);}
  tbody td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:var(--bg-panel);}
  .name{font-weight:600;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .pos{
    display:inline-block;min-width:24px;text-align:center;
    font-family:'JetBrains Mono',monospace;font-weight:600;
  }
  .pos.podium{color:var(--accent-warm);}
  .badge{
    font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 7px;border-radius:100px;
    border:1px solid var(--line);color:var(--text-dim);white-space:nowrap;
  }

  .segbar{
    display:flex;height:8px;border-radius:4px;overflow:hidden;min-width:120px;
    background:var(--line);
  }
  .segbar span{display:block;height:100%;}
  .seg-legend{display:flex;gap:10px;font-size:11px;color:var(--text-dim);margin-top:20px;}
  .seg-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle;}

  .chart-panel{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin-bottom:24px;
  }
  .chart-panel h3{
    font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0 0 4px;
  }
  .chart-panel p{color:var(--text-dim);font-size:12px;margin:0 0 16px;}

  .upcoming{margin-top:44px;}
  .upcoming > h2{
    font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 4px;
  }
  .upcoming > p.lede{color:var(--text-dim);font-size:13px;margin:0 0 20px;}
  .stage-card{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:16px;
  }
  .stage-card-head{
    display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;
    margin-bottom:12px;
  }
  .stage-card-head h4{
    font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0;
  }
  .stage-card-head .meta{color:var(--text-dim);font-size:12px;}
  .reg-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;border-top:1px solid var(--line);gap:10px;flex-wrap:wrap;
  }
  .reg-row:first-of-type{border-top:none;}
  .reg-name{font-weight:600;font-size:13px;}
  .reg-distance{color:var(--text-dim);font-size:12px;}
  .paid-badge{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
    padding:3px 9px;border-radius:100px;white-space:nowrap;
  }
  .paid-badge.yes{background:rgba(111,169,106,0.18);color:var(--run);}
  .paid-badge.no{background:rgba(224,149,78,0.18);color:var(--bike);}
  .no-upcoming{color:var(--text-dim);font-size:13px;}

  footer{
    margin-top:40px;color:var(--text-dim);font-size:12px;text-align:center;
  }
  footer a{color:var(--accent);}

  @media (max-width:640px){
    table, thead, tbody, tr, th, td{display:block;}
    thead{display:none;}
    tbody tr{border-bottom:1px solid var(--line);padding:12px 0;}
    tbody td{border:none;padding:4px 0;display:flex;justify-content:space-between;gap:12px;}
    tbody td::before{content:attr(data-label);color:var(--text-dim);font-size:11px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <p class="eyebrow">Lietuvos Triatlono Taurė · Club tracker</p>
      <h1>HighPeaks Lietuva</h1>
      <p class="sub">Results pulled from triatlonotaure.lt, filtered to this club</p>
    </div>
  </header>

  <div class="stats" id="stats"></div>



    <div class="controls">
    <select id="seasonFilter"><option value="">All seasons</option></select>
    <select id="stageFilter"><option value="">All stages</option></select>
    <select id="distanceFilter">
      <option value="">All distances</option>
      <option value="od">Olimpinė distancija</option>
      <option value="sd">Sprinto distancija</option>
    </select>
    <input type="text" id="athleteSearch" placeholder="Search athlete…">
  </div>

  <div class="chart-panel" id="chartPanel" style="display:none;">
    <h3 id="chartTitle">Progress</h3>
    <p>Total finish time across stages (lower is faster)</p>
    <canvas id="athleteChart" height="90"></canvas>
  </div>

  <div id="tableWrap"></div>

  <div id="upcomingSection"></div>

  <div class="seg-legend">
    <span><i style="background:var(--swim);"></i>Swim</span>
    <span><i style="background:var(--bike);"></i>Bike</span>
    <span><i style="background:var(--run);"></i>Run</span>
  </div>

  <footer>
    Data source: <a href="https://www.triatlonotaure.lt/stages" target="_blank" rel="noopener">triatlonotaure.lt</a> ·
    Refreshed automatically via GitHub Actions
  </footer>

</div>

<script>
const DIST_LABELS = { od: "Olimpinė", sd: "Sprinto" };






let allRows = [];
let stageNames = {};
let upcomingData = {};
let chart = null;

function getSeason(stageId) {
  const name = stageNames[stageId];
  if (!name) return null;
  const match = name.match(/\((\d{4})/);
  return match ? match[1] : null;
}

function timeToSeconds(t) {
  if (!t) return null;
  const parts = t.split(':').map(Number);
  if (parts.some(isNaN)) return null;
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if (parts.length === 2) return parts[0]*60 + parts[1];
  return null;
}

function stageLabel(stageId) {
  return stageNames[stageId] || `Stage ${stageId}`;
}

async function loadData() {
  const [resultsRes, namesRes, upcomingRes] = await Promise.allSettled([
    fetch('./data.json'),
    fetch('./stage_names.json'),
    fetch('./upcoming.json')
  ]);

  if (resultsRes.status === 'fulfilled' && resultsRes.value.ok) {
    allRows = await resultsRes.value.json();
  } else {
    allRows = [];
  }
  if (namesRes.status === 'fulfilled' && namesRes.value.ok) {
    try { stageNames = await namesRes.value.json(); } catch(e) { stageNames = {}; }
  }
































    if (upcomingRes.status === 'fulfilled' && upcomingRes.value.ok) {
    try { upcomingData = await upcomingRes.value.json(); } catch(e) { upcomingData = {}; }
  }

  populateSeasonFilter();
  populateStageFilter();
  render();
  renderUpcoming();
}

function populateSeasonFilter() {
  const seasonFilter = document.getElementById('seasonFilter');
  const seasons = [...new Set(Object.keys(stageNames).map(id => getSeason(id)).filter(Boolean))].sort((a,b) => b - a);
  
  seasonFilter.innerHTML = '<option value="">All seasons</option>';
  seasons.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    seasonFilter.appendChild(opt);
  });

  // Pre-select the latest season by default
  if (seasons.length > 0) {
    seasonFilter.value = seasons[0];
  }
}

function populateStageFilter() {
  const stageFilter = document.getElementById('stageFilter');
  const selectedSeason = document.getElementById('seasonFilter').value;
  
  const currentVal = stageFilter.value;
  stageFilter.innerHTML = '<option value="">All stages</option>';

  const stageIds = [...new Set(allRows.map(r => String(r._stage_id)))]
    .filter(id => !selectedSeason || getSeason(id) === selectedSeason)
    .sort((a,b) => Number(a) - Number(b));

  stageIds.forEach(id => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = stageLabel(id);
    stageFilter.appendChild(opt);
  });
  
  if ([...stageFilter.options].some(o => o.value === currentVal)) {
    stageFilter.value = currentVal;
  }
}

function currentFilters() {
  return {
    season: document.getElementById('seasonFilter').value,
    stage: document.getElementById('stageFilter').value,
    distance: document.getElementById('distanceFilter').value,
    athlete: document.getElementById('athleteSearch').value.trim().toLowerCase()
  };
}

function filteredRows() {
  const f = currentFilters();
  return allRows.filter(r => {
    const sId = String(r._stage_id);
    if (f.season && getSeason(sId) !== f.season) return false;
    if (f.stage && sId !== String(f.stage)) return false;
    if (f.distance && r._distance !== f.distance) return false;
    if (f.athlete) {
      const full = `${r['FIRST NAME']||''} ${r['LAST NAME']||''}`.toLowerCase();
      if (!full.includes(f.athlete)) return false;
    }
    return true;
  });
}

function renderStats(rows) {
  const stats = document.getElementById('stats');
  const stageCount = new Set(rows.map(r => r._stage_id)).size;
  const athleteCount = new Set(rows.map(r => `${r['FIRST NAME']}|${r['LAST NAME']}`)).size;
  const podiums = rows.filter(r => ['1','2','3'].includes(String(r['POS']))).length;
  stats.innerHTML = `
    <div class="stat"><div class="n">${rows.length}</div><div class="l">Results</div></div>
    <div class="stat"><div class="n">${stageCount}</div><div class="l">Stages</div></div>
    <div class="stat"><div class="n">${athleteCount}</div><div class="l">Athletes</div></div>
    <div class="stat"><div class="n">${podiums}</div><div class="l">Podium finishes</div></div>
  `;
}

function segBar(row) {
  const swim = timeToSeconds(row['SWIM']) || 0;
  const bike = timeToSeconds(row['BIKE']) || 0;
  const run = timeToSeconds(row['RUN']) || 0;
  const total = swim + bike + run;
  if (!total) return `<div class="segbar"></div>`;
  const pct = s => (s/total*100).toFixed(1);
  return `<div class="segbar" title="Swim ${row['SWIM']||'—'} · Bike ${row['BIKE']||'—'} · Run ${row['RUN']||'—'}">
    <span style="width:${pct(swim)}%;background:var(--swim);"></span>
    <span style="width:${pct(bike)}%;background:var(--bike);"></span>
    <span style="width:${pct(run)}%;background:var(--run);"></span>
  </div>`;
}

function renderTable(rows) {
  const wrap = document.getElementById('tableWrap');
  if (!rows.length) {
    wrap.innerHTML = `<div class="empty">
      <strong>No results yet.</strong><br><br>
      If this is your first run, the scraper hasn't populated <code>docs/data.json</code> yet —
      run it locally or trigger the GitHub Action.
    </div>`;
    return;
  }

  const sorted = [...rows].sort((a,b) => (Number(a['POS'])||999) - (Number(b['POS'])||999));

  wrap.innerHTML = `
  <table>
    <thead>
      <tr>
        <th>Pos</th><th>Athlete</th><th>Stage</th><th>Distance</th>
        <th>Total</th><th>Split</th><th>Age group</th>
      </tr>
    </thead>
    <tbody>
      ${sorted.map(r => `
        <tr>
          <td data-label="Pos"><span class="pos ${['1','2','3'].includes(String(r['POS']))?'podium':''}">${r['POS']||'—'}</span></td>
          <td data-label="Athlete"><span class="name">${r['FIRST NAME']||''} ${r['LAST NAME']||''}</span></td>
          <td data-label="Stage">${stageLabel(r._stage_id)}</td>
          <td data-label="Distance"><span class="badge">${DIST_LABELS[r._distance]||r._distance}</span></td>
          <td data-label="Total" class="mono">${r['TOTAL']||'—'}</td>
          <td data-label="Split">${segBar(r)}</td>
          <td data-label="Age group">${r['AGE GROUP']||'—'}</td>
        </tr>
      `).join('')}
    </tbody>
  </table>`;
}

function renderChart(rows, athleteQuery) {
  const panel = document.getElementById('chartPanel');
  if (!athleteQuery) { panel.style.display = 'none'; return; }

  const athleteRows = rows
    .filter(r => `${r['FIRST NAME']} ${r['LAST NAME']}`.toLowerCase().includes(athleteQuery))
    .map(r => ({ stage: stageLabel(r._stage_id), seconds: timeToSeconds(r['TOTAL']), stageId: r._stage_id }))
    .filter(r => r.seconds)
    .sort((a,b) => a.stageId - b.stageId);

  if (athleteRows.length < 2) { panel.style.display = 'none'; return; }

  panel.style.display = 'block';
  document.getElementById('chartTitle').textContent = `Progress — matching "${athleteQuery}"`;

  const ctx = document.getElementById('athleteChart').getContext('2d');
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: athleteRows.map(r => r.stage),
      datasets: [{
        label: 'Total time (min)',
        data: athleteRows.map(r => (r.seconds/60).toFixed(1)),
        borderColor: '#E8A33D',
        backgroundColor: 'rgba(232,163,61,0.15)',
        tension: 0.3,
        fill: true,
        pointRadius: 4,
        pointBackgroundColor: '#E8A33D'
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8FADB3' }, grid: { color: '#2A4B58' } },
        y: { ticks: { color: '#8FADB3' }, grid: { color: '#2A4B58' }, title: { display: true, text: 'minutes', color: '#8FADB3' } }
      }
    }
  });
}

function render() {
  const rows = filteredRows();
  renderStats(rows);
  renderTable(rows);
  renderChart(rows, currentFilters().athlete);
}

function renderUpcoming() {
  const container = document.getElementById('upcomingSection');
  const stageIds = Object.keys(upcomingData);

  if (!stageIds.length) {
    container.innerHTML = '';
    return;
  }

  const cards = stageIds
    .sort((a, b) => new Date(upcomingData[a].stage_date) - new Date(upcomingData[b].stage_date))
    .map(stageId => {
      const stage = upcomingData[stageId];
      const regs = stage.club_registrations || [];
      const dateStr = (stage.stage_date || '').slice(0, 10);

      if (!regs.length) {
        return `
        <div class="stage-card">
          <div class="stage-card-head">
            <h4>${stage.stage_name || `Stage ${stageId}`}</h4>
            <span class="meta">${dateStr} · ${stage.address || ''}</span>
          </div>
          <p class="no-upcoming">No HighPeaks Lietuva registrations yet.</p>
        </div>`;
      }

      const paidCount = regs.filter(r => r.payed).length;

      return `
      <div class="stage-card">
        <div class="stage-card-head">
          <h4>${stage.stage_name || `Stage ${stageId}`}</h4>
          <span class="meta">${dateStr} · ${stage.address || ''} · ${regs.length} registered, ${paidCount} paid</span>
        </div>
        ${regs.map(r => `
          <div class="reg-row">
            <div>
              <span class="reg-name">${r.displayName || `${r.first_name||''} ${r.last_name||''}`}</span>
              <span class="reg-distance"> — ${r.distance_name || 'Unknown distance'}</span>
            </div>
            <span class="paid-badge ${r.payed ? 'yes' : 'no'}">
              ${r.payed ? 'Paid' : 'Unpaid'}${r.price ? ` · €${r.price}` : ''}
            </span>
          </div>
        `).join('')}
      </div>`;
    }).join('');

  container.innerHTML = `
    <div class="upcoming">
      <h2>Upcoming races</h2>
      <p class="lede">HighPeaks Lietuva registrations for races that haven't happened yet</p>
      ${cards}
    </div>
  `;
}



['seasonFilter'].forEach(id =>
  document.getElementById(id).addEventListener('change', () => {
    populateStageFilter();
    render();
  })
);
['stageFilter','distanceFilter'].forEach(id =>
  document.getElementById(id).addEventListener('change', render)
);
document.getElementById('athleteSearch').addEventListener('input', render);

loadData();
</script>
</body>
</html>
